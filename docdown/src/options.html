<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Docdown</title>
    <link rel="icon" href="../icons/icon32.png" />
    <link rel="stylesheet" href="popup.css" />
    <style>
      body {
        width: auto;
        height: auto;
        display: block;
        max-width: 720px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }
      h1 {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 20px;
      }
      .field {
        display: grid;
        gap: 6px;
        margin: 18px 0;
      }
      .field > span {
        font-weight: 600;
      }
      textarea {
        width: 100%;
        min-height: 170px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--fg);
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      pre {
        margin: 0;
        padding: 10px 12px;
        border-radius: 6px;
        background: var(--subtle);
        font-size: 12px;
        white-space: pre-wrap;
      }
      .help,
      .note {
        color: var(--muted);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #saved {
        color: var(--accent);
      }
      select {
        width: max-content;
      }
    </style>
  </head>
  <body>
    <h1><img src="../icons/icon48.png" width="32" height="32" alt="" /> <span data-i18n="optTitle">Docdown settings</span></h1>

    <label class="field">
      <span data-i18n="optDefaultMode">Default clip mode</span>
      <select id="defaultMode">
        <option value="article" data-i18n="modeArticle">Article</option>
        <option value="page" data-i18n="modePage">Whole page</option>
        <option value="selection" data-i18n="modeSelection">Selection</option>
      </select>
    </label>

    <label class="field">
      <span data-i18n="optFrontMatter">Front matter</span>
      <select id="frontMatter">
        <option value="none" data-i18n="fmNone">None</option>
        <option value="basic" data-i18n="fmBasic">Basic</option>
        <option value="custom" data-i18n="fmCustom">Custom</option>
      </select>
    </label>

    <div class="field">
      <span data-i18n="optTemplate">Custom front matter template</span>
      <textarea id="template" spellcheck="false"></textarea>
      <div class="help" data-i18n="optTemplateHelp"></div>
      <div class="row"><button type="button" id="reset" data-i18n="optReset">Reset template</button></div>
      <pre id="sample"></pre>
    </div>

    <label class="row"><input type="checkbox" id="images" /> <span data-i18n="optImages">Keep images</span></label>

    <p class="note" data-i18n="optShortcut"></p>
    <p id="saved" hidden data-i18n="optSaved">Saved</p>

    <script src="../vendor/readown-render.js"></script>
    <script src="frontmatter.js"></script>
    <script src="options.js"></script>
  </body>
</html>
